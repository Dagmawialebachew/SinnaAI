services:
  postgres:
    image: postgres:17-alpine
    container_name: sinna-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sinna_secret_2026
      POSTGRES_DB: sinna_dental_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
